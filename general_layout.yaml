version: 1
connection:
  transport: rosbridge
  host: 192.168.137.134
  port: 9090
  ssh:
    host: 192.168.137.134
    port: 22
    username: fsae
    password: fsae
    key_path: null
    local_port: 9090
    remote_port: 9090
    launch_bridge: false
panels:
- id: trackview_6e04892f
  type: trackview
  title: Track View (2D)
  config:
    topics:
      car_topic: /fsae/slam/car_position
      trajectory_topic: /fsae/planning/selected_trajectory
      left_topic: /fsae/slam/left_track
      right_topic: /fsae/slam/right_track
      detections_topic: /cone_detection_fused
    follow: false
    yaw_offset_deg: 0.0
    show_walls: true
    laptime_enabled: true
    laps_collapsed: true
    lap_pos: null
    fusion_cloud: false
    fusion_cloud_topic: /lidar_fusion/cone_points
- id: timeseries_1fa420b8
  type: timeseries
  title: Time Series Plot
  config:
    history_s: 30
    series:
    - topic: /fsae/control/cmd_vel
      type: ackermann_msgs/AckermannDriveStamped
      field: drive.speed
      label: speed
    - topic: /fsae/control/cmd_vel
      type: ackermann_msgs/AckermannDriveStamped
      field: drive.steering_angle
      label: steer
- id: stat_tiles_7f8b8a0c
  type: stat_tiles
  title: Stat Tiles
  config:
    tiles:
    - topic: /fsae/mission/as_status
      type: std_msgs/UInt8
      field: data
      label: AS state
      fmt: '{:.0f}'
    - topic: /fsae/hardware/battery_state
      type: sensor_msgs/BatteryState
      field: voltage
      label: HV battery (V)
      fmt: '{:.1f}'
- id: topic_browser_116e367d
  type: topic_browser
  title: Topic Browser
  config:
    subscribed: []
- id: raw_inspector_c5447b63
  type: raw_inspector
  title: Raw Message Inspector
  config:
    topic: /cone_detection_fused
