version: 1
connection:
  transport: rosbridge
  host: 192.168.137.134
  port: 9090
  ssh:
    host: 192.168.137.134
    port: 22
    username: fsae
    password: fsae
    key_path: null
    local_port: 9090
    remote_port: 9090
    launch_bridge: false
panels:
- id: trackview_2f4dc6f1
  type: trackview
  title: Track View (2D)
  config:
    topics:
      car_topic: /fsae/slam/car_position
      trajectory_topic: /fsae/planning/selected_trajectory
      left_topic: /fsae/slam/left_track
      right_topic: /fsae/slam/right_track
      detections_topic: /fsae/perception/cone_detection
    follow: false
    yaw_offset_deg: 0.0
- id: timeseries_30ac013d
  type: timeseries
  title: Time Series Plot
  config:
    history_s: 60
    series:
    - topic: /fsae/slam/car_position
      type: geometry_msgs/msg/Pose
      field: position.x
      label: car_position.position.x
    - topic: /zed/zed_node/imu/data
      type: sensor_msgs/msg/Imu
      field: angular_velocity.x
      label: data.angular_velocity.x
- id: stat_tiles_8b60f3c7
  type: stat_tiles
  title: Stat Tiles
  config:
    tiles:
    - topic: /fsae/slam/car_position
      type: geometry_msgs/msg/Pose
      field: position.x
      label: car_position.position.x
      fmt: '{:.2f}'
    - topic: /fsae/slam/car_position
      type: geometry_msgs/msg/Pose
      field: position.y
      label: car_position.position.y
      fmt: '{:.2f}'
- id: topic_browser_f8728476
  type: topic_browser
  title: Topic Browser
  config:
    subscribed: []
- id: raw_inspector_cb1a7739
  type: raw_inspector
  title: Raw Message Inspector
  config:
    topic: /fsae/perception/cone_detection
- id: camera_02f0eced
  type: camera
  title: Camera
  config:
    topic: /zed/zed_node/depth/depth_registered
    type: sensor_msgs/msg/Image
